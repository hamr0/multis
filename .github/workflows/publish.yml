# npm publish — manual only (run when you want, via "Run workflow").
#
# Auth: npm trusted publishing via OIDC (no NPM_TOKEN). Configure the trusted
# publisher once at npmjs.com (Package → Settings → Trusted Publisher → GitHub
# Actions: this repo + this workflow file) before the first run.
#
# Idempotent: skips a version already on the registry, and asserts the END
# STATE (polls the registry) rather than trusting npm's exit code, because
# npm's OIDC flow can exit non-zero from a trailing web-auth 401 *after* the
# tarball + provenance are already published. `prepublishOnly` builds any
# generated artifacts (e.g. .d.ts) into the tarball at publish time.
name: Publish to npm

on:
  workflow_dispatch:        # manual "Run workflow" button — publish when you want

permissions:
  contents: read
  id-token: write           # required: lets npm mint OIDC credentials

concurrency:                # never let two publish runs race
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # A blackholed Hugging Face fetch (embedding model, tests) has no timeout of
    # its own, so bound the job and fail fast instead of GitHub's 6h default.
    # Budget: the Test step is capped at 6 min; each registry poll call in the
    # Publish step is bounded at ~40s worst case (15s fetch timeout + 10s retry
    # backoff + 1 retry). A fully hung registry could still run the 20-pass loop
    # past the job cap, so the 10 min cap is what ends it; the package is already
    # live then, the run shows red, and a re-run takes the "already on npm" skip.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - name: Upgrade npm (trusted publishing needs >= 11.5.1)
        # Pin to a MAJOR, not @latest. Stay on npm@11 (NOT 12) for publishing:
        # npm 12.0.0's `npm publish --provenance` is broken — its libnpmpublish
        # provenance.js does `require('sigstore')` but the tarball only bundles the
        # `@sigstore/*` scoped packages, so publish dies with MODULE_NOT_FOUND. npm@11
        # bundles `sigstore` and publishes fine. npm@11 also doesn't block install
        # scripts, so native addons (better-sqlite3, onnxruntime-node) build here
        # without needing the allowScripts allowlist. That allowlist still ships in
        # package.json for END USERS on npm 12 (see README --allow-scripts note).
        # Revisit npm@12 + `npm ci --strict-allow-scripts` once npm fixes provenance.
        run: npm install -g npm@11
      - name: Install dependencies
        run: npm ci
      - name: Embedding model cache key
        # The test suite loads Xenova/all-MiniLM-L6-v2 (litectx's default, q8) via
        # @huggingface/transformers; key on its installed version so a bump re-fetches.
        id: hf
        run: echo "ver=$(node -p "require('./node_modules/@huggingface/transformers/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache embedding model
        # Publish shouldn't depend on Hugging Face being reachable on every run.
        # transformers.js defaults env.cacheDir to <its package dir>/.cache, i.e.
        # INSIDE node_modules, which `npm ci` deletes — so this restore MUST stay
        # after "Install dependencies" or it would be wiped before the tests run.
        uses: actions/cache@v6
        with:
          path: node_modules/@huggingface/transformers/.cache
          key: hf-Xenova-all-MiniLM-L6-v2-q8-transformers-${{ steps.hf.outputs.ver }}
          restore-keys: |
            hf-Xenova-all-MiniLM-L6-v2-q8-transformers-
      - name: Lockfile version matches package.json
        # `npm ci` above already fails when the lockfile's DEPENDENCY entries
        # disagree with package.json; it does not check the lockfile's copy of
        # this project's own version. A release that bumps package.json without
        # running an install leaves that field behind, and nothing caught it —
        # measured in bareguard, stale across three consecutive releases.
        # No-ops via --if-present in a repo that has not added the script.
        run: npm run check:lockfile --if-present
      - name: Typecheck
        run: npm run typecheck --if-present
      - name: Test
        timeout-minutes: 6
        run: npm test --if-present
      - name: Warn if the embedding model cache is empty
        # Warning only, never fails: an empty cache means the tests (and the next
        # publish) depend on Hugging Face being reachable.
        run: |
          CACHE_DIR=node_modules/@huggingface/transformers/.cache
          if [ -z "$(ls -A "$CACHE_DIR" 2>/dev/null)" ]; then
            echo "::warning::Embedding model cache ($CACHE_DIR) is empty after tests — the cache step will save nothing and the next run will refetch from Hugging Face."
          fi
      - name: Skip if this version is already on npm
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view "$NAME@$VERSION" version 2>/dev/null || true)
          if [ -n "$PUBLISHED" ]; then
            echo "::notice::$NAME@$VERSION already published — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        if: steps.check.outputs.skip == 'false'
        run: |
          # Don't trust npm's exit code (see header): publish, then assert the
          # version is actually on the registry. A genuine failure still fails.
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          PUBLISH_EXIT=0
          npm publish --provenance --access public || PUBLISH_EXIT=$?
          # Registry read-after-write can lag well past 15s. Poll generously
          # (~2 min) so the end-state check doesn't false-negative a publish that
          # actually succeeded. `npm view` caches, so --prefer-online bypasses it.
          PUBLISHED=""
          for _ in $(seq 1 20); do
            PUBLISHED=$(npm view "$NAME@$VERSION" version --prefer-online --fetch-timeout=15000 --fetch-retries=1 2>/dev/null || true)
            [ "$PUBLISHED" = "$VERSION" ] && break
            sleep 6
          done
          if [ "$PUBLISHED" = "$VERSION" ]; then
            if [ "$PUBLISH_EXIT" -ne 0 ]; then
              echo "::warning::npm publish exited $PUBLISH_EXIT but $NAME@$VERSION is on the registry (known npm OIDC post-publish web-auth 401); treating as success."
            fi
            echo "✅ Published $NAME@$VERSION"
          elif [ "$PUBLISH_EXIT" -eq 0 ]; then
            echo "::warning::npm publish exited 0 but $NAME@$VERSION not yet visible after ~2 min (registry reflection lag); treating as success."
            echo "✅ Published $NAME@$VERSION (npm exit 0; registry lagging)"
          else
            echo "::error::npm publish failed (exit $PUBLISH_EXIT) and $NAME@$VERSION is NOT on the registry."
            exit 1
          fi
